plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.generalgame'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('general-debug.keystore')
            storePassword 'general-debug-pass'
            keyAlias 'generaldebug'
            keyPassword 'general-debug-pass'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    defaultConfig {
        applicationId 'com.generalgame'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '0.3.7'
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
}
