name: Validate GENERAL 3D prototype

on:
  push:
    branches: [ "3d-prototype" ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Import project and validate scripts
        run: godot --headless --editor --path godot --quit
