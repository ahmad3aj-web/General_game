name: Build GENERAL 3D Android APK

on:
  push:
    branches: [ "3d-prototype" ]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
      - "general-debug.keystore.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/general-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: generaldebug
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: general-debug-pass
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest ndk;23.2.8568313 cmake;3.10.2.4988404'

      - name: Install Godot 4.4.1 editor
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          printf '4.4.1.stable' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"

      - name: Restore stable debug signing key
        run: base64 --decode general-debug.keystore.b64 > general-debug.keystore

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "generaldebug"
          export/android/debug_keystore_pass = "general-debug-pass"
          EOF

      - name: Import Godot project
        run: godot --headless --editor --path godot --quit

      - name: Export Android APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug "Android" build/GENERAL-3D-preview.apk

      - name: Verify APK exists
        run: test -s godot/build/GENERAL-3D-preview.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GENERAL-3D-Android-APK
          path: godot/build/GENERAL-3D-preview.apk
          if-no-files-found: error
          retention-days: 14
