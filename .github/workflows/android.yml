name: Build GENERAL Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/cards-system-design" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: base64 --decode general-debug.keystore.b64 > general-debug.keystore
      - name: Download recorded military music from Pixabay
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, pathlib, html
          tracks = [
              ("269842", "https://pixabay.com/music/main-title-army-military-war-music-269842/", "battle_music_1.mp3"),
              ("160359", "https://pixabay.com/music/main-title-song-of-war-160359/", "battle_music_2.mp3"),
              ("314656", "https://pixabay.com/music/main-title-war-army-military-music-314656/", "battle_music_3.mp3"),
              ("338668", "https://pixabay.com/music/main-title-war-battle-military-music-338668/", "battle_music_4.mp3"),
          ]
          out = pathlib.Path("app/src/main/res/raw")
          out.mkdir(parents=True, exist_ok=True)
          def find_url(obj):
              if isinstance(obj, dict):
                  value = obj.get("contentUrl")
                  if isinstance(value, str) and "cdn.pixabay.com/audio/" in value and value.lower().endswith(".mp3"):
                      return value
                  for item in obj.values():
                      found = find_url(item)
                      if found: return found
              elif isinstance(obj, list):
                  for item in obj:
                      found = find_url(item)
                      if found: return found
              return None
          for track_id, page, filename in tracks:
              request = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=40) as response:
                  source = response.read().decode("utf-8", "replace")
              audio_url = None
          scripts = re.findall(r"<script[^>]*type=['\"]application/ld\+json['\"][^>]*>(.*?)</script>", source, re.I | re.S)
              for script in scripts:
                  try:
                      audio_url = find_url(json.loads(html.unescape(script)))
                  except (ValueError, TypeError):
                      pass
                  if audio_url: break
              if not audio_url:
              urls = re.findall(r'https://cdn\.pixabay\.com/audio/[^"<> ]+?\.mp3', source)
                  audio_url = next((url for url in urls if track_id in url), urls[0] if urls else None)
              if not audio_url:
                  raise RuntimeError("Could not extract MP3 URL for track " + track_id)
              request = urllib.request.Request(audio_url, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://pixabay.com/music/"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              if len(data) < 100000 or not (data.startswith(b"ID3") or data[:2] in (bytes([255,251]), bytes([255,243]), bytes([255,242]))):
                  raise RuntimeError("Invalid MP3 for " + filename + "; bytes=" + str(len(data)))
              (out / filename).write_bytes(data)
              print("Downloaded and verified " + filename + ": " + str(len(data)) + " bytes")
          PY
      - name: Prepare transparent card artwork
        run: |
          python3 -m pip install --user pillow
          python3 scripts/prepare_card_art.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GENERAL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
