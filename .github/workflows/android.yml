name: Build GENERAL Android APK
# Keep the canonical cards-and-missions branch buildable.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "feature/cards-system-design", "feature/menu-gold-burgundy-screens" ]
  push:
    branches: [ "main", "feature/cards-system-design", "feature/menu-gold-burgundy-screens", "feature/gameplay-agreed-fixes" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: base64 --decode general-debug.keystore.b64 > general-debug.keystore
      - name: Download four CC0 battle music tracks
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          tracks = [
              ("https://raw.githubusercontent.com/enqiang/taohuayuan/47931d58f58f5f4d64d64c3408e98ee733e10688/assets/audio/taoyuan_battle.ogg", "battle_music_1.ogg"),
              ("https://raw.githubusercontent.com/enqiang/taohuayuan/47931d58f58f5f4d64d64c3408e98ee733e10688/assets/audio/taoyuan_boss.ogg", "battle_music_2.ogg"),
              ("https://raw.githubusercontent.com/mamba4live0918/baiyao-live-studio/c07c9b38c9b06d8cf938db31eee23ec150672dce/assets/celebrate/audio/bgm-epic-rock.ogg", "battle_music_3.ogg"),
              ("https://raw.githubusercontent.com/mamba4live0918/baiyao-live-studio/c07c9b38c9b06d8cf938db31eee23ec150672dce/assets/celebrate/audio/bgm-rise.ogg", "battle_music_4.ogg"),
          ]
          out = pathlib.Path("app/src/main/res/raw")
          out.mkdir(parents=True, exist_ok=True)
          for url, filename in tracks:
              request = urllib.request.Request(url, headers={"User-Agent": "GENERAL-Android-Build"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              if len(data) < 50000 or not data.startswith(b"OggS"):
                  raise RuntimeError("Invalid OGG audio for " + filename + "; bytes=" + str(len(data)))
              (out / filename).write_bytes(data)
              print("Downloaded and verified " + filename + ": " + str(len(data)) + " bytes")
          PY
      - name: Prepare transparent card artwork
        run: |
          python3 -m pip install --user pillow numpy
          python3 scripts/prepare_card_art.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GENERAL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
