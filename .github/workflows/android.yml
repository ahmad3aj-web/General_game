name: Build GENERAL Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/cards-system-design" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: base64 --decode general-debug.keystore.b64 > general-debug.keystore
      - name: Generate three original calm cinematic battle soundtracks
        run: |
          python3 -m pip install --user numpy
          python3 scripts/generate_battle_music.py
          if command -v ffmpeg >/dev/null 2>&1; then
            for track in app/src/main/res/raw/battle_music_1.wav app/src/main/res/raw/battle_music_2.wav app/src/main/res/raw/battle_music_3.wav; do
              ffmpeg -y -loglevel error -i "$track" -vn -ac 2 -ar 44100 -c:a libmp3lame -b:a 96k "${track%.wav}.mp3"
              rm "$track"
            done
          else
            echo "ffmpeg unavailable; using the generated WAV soundtracks"
          fi
      - name: Prepare transparent card artwork
        run: |
          python3 -m pip install --user pillow
          python3 scripts/prepare_card_art.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GENERAL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
